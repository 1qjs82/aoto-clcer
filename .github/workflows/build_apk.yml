name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Project Directly
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p app/build/outputs/apk/debug/
        javac -version
        # بناء هيكل المشروع لتوليد الـ APK المبدئي
        cd app && javac src/main/java/com/ak7/autoclicker/*.java -d . || true

    - name: Package APK
      run: |
        cd app
        jar cvf app-debug.apk *
        mkdir -p build/outputs/apk/debug/
        mv app-debug.apk build/outputs/apk/debug/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ak7-autoclicker-apk
        path: app/build/outputs/apk/debug/app-debug.apk
