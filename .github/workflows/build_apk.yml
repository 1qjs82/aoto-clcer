name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto-Configure Project & Gradle
      run: |
        # ضبط الإعدادات الجذرية تلقائياً لضمان نجاح البناء
        echo "include ':app'" > settings.gradle
        
        if [ ! -f "build.gradle" ]; then
          echo "buildscript { repositories { google() mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }" > build.gradle
        fi

        gradle wrapper --gradle-version 8.0

    - name: Build Real APK with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ak7-autoclicker-apk
        path: app/build/outputs/apk/debug/app-debug.apk
